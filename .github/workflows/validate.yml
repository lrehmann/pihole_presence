name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2023.1.7"
            python: "3.10"
          - ha: "2024.11.3"
            python: "3.12"
          - ha: "2025.12.5"
            python: "3.13"
          - ha: "2026.10.4"
            python: "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install "homeassistant==${{ matrix.ha }}" "pytest>=8,<9" "pytest-asyncio==1.3.0" "setuptools<81" ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Check formatting
        run: ruff format --check custom_components tests
      - name: Regression tests
        run: python -m pytest -q

  validate-hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false

  validate-hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
